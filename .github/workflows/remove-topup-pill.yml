name: Remove top-up asset pill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-topup-pill.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove USDC plus native pill from Top Up Wallet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          old='<div class="pill"><img src="https://assets.relay.link/icons/currencies/usdc.png" alt="">USDC + native</div>'
          if old not in s:
              raise SystemExit('Top Up Wallet asset pill not found')
          s=s.replace(old,'',1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Remove top-up asset pill"
          git push
