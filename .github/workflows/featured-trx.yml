name: Featured TRX swap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/featured-trx.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Arbitrum with TRX in featured networks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          old = "const featuredSlugs=['solana','ethereum','base','bnb','robinhood','arbitrum','optimism','polygon'];const featured=featuredSlugs.map(slug=>networks.find(n=>n.slug===slug)).filter(Boolean);featured.forEach(n=>pg.append(btn(n)));"
          new = "const featuredSlugs=['solana','ethereum','base','bnb','robinhood','tron','optimism','polygon'];const featured=featuredSlugs.map(slug=>networks.find(n=>n.slug===slug)).filter(Boolean);featured.forEach(n=>{const b=btn(n);if(n.slug==='tron')b.querySelector('.nname').textContent='TRX';pg.append(b)});"
          if old not in s:
              raise SystemExit('Featured network block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Replace Arbitrum with TRX in featured networks"
          git push
