name: Fully remove asset pill component

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-pill-component.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover pill component styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          s=s.replace('.pill{margin-left:auto;display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.045);color:#d2d2d7;font-size:10px;font-weight:600}.pill img{width:19px;height:19px;border-radius:50%}','')
          s=s.replace('.pill{display:none}','')
          if 'USDC + native' in s:
              raise SystemExit('USDC + native markup still present')
          if 'class="pill"' in s:
              raise SystemExit('pill markup still present')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Fully remove top-up asset pill component"
          git push
