name: Simplify deposit assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-deposit-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove asset toggle and use one address per chain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text()

          # Replace interactive asset picker with a single informational accepted-assets row.
          old='<div class="asset-picker" id="assetPicker"><button class="asset-option active" id="usdcAsset" type="button"><span class="asset-symbol">USDC</span><span class="asset-kind">Stablecoin</span></button><button class="asset-option" id="nativeAsset" type="button"><span class="asset-symbol" id="nativeSymbol">ETH</span><span class="asset-kind">Native token</span></button></div>'
          new='<div class="accepted-assets"><span>Accepted assets</span><strong id="acceptedAssets">USDC + ETH</strong></div>'
          if old not in s:
              raise SystemExit('asset picker markup not found')
          s=s.replace(old,new,1)

          s=s.replace('<h2 id="depositTitle">Deposit funds</h2><p>Choose USDC or the native token, then scan or copy the address.</p>', '<h2 id="depositTitle">Deposit funds</h2><p id="depositSubtitle">Send USDC or the native token to this address.</p>',1)
          s=s.replace('<div class="row"><span>Asset</span><strong id="assetName">USDC</strong></div><div class="row"><span>Destination</span><strong id="destinationText">General USDC balance</strong></div>', '<div class="row"><span>Accepted</span><strong id="assetName">USDC + ETH</strong></div><div class="row"><span>Settlement</span><strong id="destinationText">USDC balance</strong></div>',1)

          # Replace picker CSS with a compact informational row.
          start=s.find('.asset-picker{')
          end=s.find('.address-card{', start)
          if start==-1 or end==-1:
              raise SystemExit('asset picker CSS block not found')
          new_css='.accepted-assets{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);font-size:10px}.accepted-assets span{color:var(--muted-2)}.accepted-assets strong{color:#f0f0f3;font-size:11px;font-weight:700}'
          s=s[:start]+new_css+s[end:]

          # Remove mobile picker rules and add a compact mobile accepted-assets rule.
          s=re.sub(r'#addressView \.asset-picker\{[^}]*\}#addressView \.asset-option\{[^}]*\}#addressView \.asset-symbol\{[^}]*\}#addressView \.asset-kind\{[^}]*\}', '#addressView .accepted-assets{margin-bottom:6px;padding:7px 9px;font-size:8px}#addressView .accepted-assets strong{font-size:9px}', s, count=1)

          # Replace state and asset-specific logic with a single per-chain address.
          s=s.replace(";let selected=null,selectedAsset='USDC',timer=null;", ";let selected=null,timer=null;",1)

          pattern=r"function nativeFor\(n\)\{return nativeSymbols\[n\.slug\]\|\|'Native'\}function currentAsset\(\)\{.*?\}function select\(n\)\{selected=n;selectedAsset='USDC';view\(address\);.*?refreshAsset\(\)\}"
          replacement="function nativeFor(n){return nativeSymbols[n.slug]||'Native'}function currentAddress(){return 'DEMO_'+selected.slug.toUpperCase().replaceAll('-','_')+'_WALLET_ADDRESS_DO_NOT_SEND'}function refreshDeposit(){if(!selected)return;const native=nativeFor(selected),addr=currentAddress();$('depositTitle').textContent='Deposit on '+selected.name;$('depositSubtitle').textContent='Send USDC or '+native+' to this same address.';$('acceptedAssets').textContent='USDC + '+native;$('assetName').textContent='USDC + '+native;$('destinationText').textContent='USDC balance';$('addressValue').textContent=addr;$('qrImage').src='https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data='+encodeURIComponent(addr);reset()}function select(n){selected=n;view(address);$('selectedName').textContent=n.name;$('selectedChain').textContent='Chain ID '+n.chainId;const i=$('selectedLogo'),f=$('selectedFallback');i.style.display='block';f.style.display='none';i.dataset.l='';i.src=n.logo;i.alt=n.name+' logo';f.textContent=n.name[0];i.onerror=()=>{if(!i.dataset.l){i.dataset.l=1;i.src=light(n.chainId)}else{i.style.display='none';f.style.display='grid'}};refreshDeposit()}"
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('deposit asset logic block not found')
          s=s2

          # Generic demo because both supported asset types share the same address.
          pattern=r"function demo\(\)\{reset\(\);const sym=currentAsset\(\);.*?\},5000\)\}"
          replacement="function demo(){reset();copy.disabled=true;copy.textContent='Address copied';status.className='status show loading';sicon.innerHTML='<span class=\"spinner\"></span>';stitle.textContent='Waiting for demo deposit…';ssub.textContent='Simulating a supported asset transfer on '+selected.name+'.';timer=setTimeout(()=>{timer=null;status.className='status show success';sicon.textContent='✓';stitle.textContent='$25 deposited';ssub.textContent='Deposit received and credited to your USDC balance. Balance is now $25.00.';balance.textContent='$25.00';$('fundsTrigger').setAttribute('aria-label','Add funds. Current balance twenty five dollars');copy.disabled=false;copy.textContent='Copy address'},5000)}"
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('demo block not found')
          s=s2

          s=s.replace("$('fundsTrigger').onclick=open;$('closeBtn').onclick=close;$('usdcAsset').onclick=()=>{selectedAsset='USDC';refreshAsset()};$('nativeAsset').onclick=()=>{selectedAsset='NATIVE';refreshAsset()};", "$('fundsTrigger').onclick=open;$('closeBtn').onclick=close;",1)
          s=s.replace("await navigator.clipboard.writeText(currentAddress());demo()", "await navigator.clipboard.writeText(currentAddress());demo()",1)

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Use one deposit address for USDC and native assets"
          git push
