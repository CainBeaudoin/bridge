name: Green plus only hover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/green-plus-only-hover.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep motion only on green plus square
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()

          old='.funds{height:66px;display:flex;align-items:center;gap:7px;padding:6px;border:1px solid var(--line);border-radius:22px;background:rgba(31,31,34,.72);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);cursor:pointer;box-shadow:0 20px 55px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .2s cubic-bezier(.22,.8,.24,1),background .2s ease,border-color .2s ease,box-shadow .2s ease}.funds:hover{transform:translateY(-2px) scale(1.015);background:rgba(40,40,43,.86);border-color:rgba(255,255,255,.18);box-shadow:0 24px 64px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.055)}.funds:active{transform:translateY(0) scale(.975)}'
          new='.funds{height:66px;display:flex;align-items:center;gap:7px;padding:6px;border:1px solid var(--line);border-radius:22px;background:rgba(31,31,34,.72);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);cursor:pointer;box-shadow:0 20px 55px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04)}'
          if old not in s:
              raise SystemExit('Current funds hover block not found')
          s=s.replace(old,new,1)

          if '.funds:hover{' in s or '.funds:active{' in s:
              raise SystemExit('Outer funds container still has hover/active animation')
          if '.plus:hover{' not in s:
              raise SystemExit('Green plus hover animation missing')

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Limit hover animation to green plus square"
          git push
