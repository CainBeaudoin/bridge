name: Animate funds trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/animate-funds-trigger.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add polished plus interaction and verify removed pill
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()

          if 'USDC + native' in s or 'class="pill"' in s:
              raise SystemExit('Old USDC + native pill is still present in source')

          old='.funds{height:66px;display:flex;align-items:center;gap:7px;padding:6px;border:1px solid var(--line);border-radius:22px;background:rgba(31,31,34,.72);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);cursor:pointer;box-shadow:0 20px 55px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .18s ease,background .18s ease,border-color .18s ease}.funds:hover{transform:translateY(-1px);background:rgba(38,38,41,.82);border-color:var(--line-strong)}.funds:active{transform:scale(.985)}.plus{width:53px;height:53px;position:relative;display:block;flex:0 0 53px;font-size:0;line-height:0;border-radius:17px;background:linear-gradient(180deg,#36d95e 0%,#28c94e 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(48,209,88,.16)}.plus:before,.plus:after{content:"";position:absolute;left:50%;top:50%;border-radius:999px;background:#fff;transform:translate(-50%,-50%)}.plus:before{width:22px;height:2.5px}.plus:after{width:2.5px;height:22px}'

          new='.funds{height:66px;display:flex;align-items:center;gap:7px;padding:6px;border:1px solid var(--line);border-radius:22px;background:rgba(31,31,34,.72);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);cursor:pointer;box-shadow:0 20px 55px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .2s cubic-bezier(.22,.8,.24,1),background .2s ease,border-color .2s ease,box-shadow .2s ease}.funds:hover{transform:translateY(-2px) scale(1.015);background:rgba(40,40,43,.86);border-color:rgba(255,255,255,.18);box-shadow:0 24px 64px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.055)}.funds:active{transform:translateY(0) scale(.975)}.plus{width:53px;height:53px;position:relative;display:block;flex:0 0 53px;font-size:0;line-height:0;border-radius:17px;background:linear-gradient(180deg,#36d95e 0%,#28c94e 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(48,209,88,.16);animation:plusBreathe 2.35s ease-in-out infinite;transition:transform .22s cubic-bezier(.22,.8,.24,1),box-shadow .22s ease,filter .22s ease}.funds:hover .plus{animation:none;transform:translateY(-1px) scale(1.075);filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 34px rgba(48,209,88,.34),0 0 0 5px rgba(48,209,88,.07)}.funds:active .plus{animation:none;transform:scale(.94)}.plus:before,.plus:after{content:"";position:absolute;left:50%;top:50%;border-radius:999px;background:#fff;transform:translate(-50%,-50%);transition:width .22s cubic-bezier(.22,.8,.24,1),height .22s cubic-bezier(.22,.8,.24,1),opacity .22s ease}.plus:before{width:22px;height:2.5px}.plus:after{width:2.5px;height:22px}.funds:hover .plus:before{width:25px}.funds:hover .plus:after{height:25px}'

          if old not in s:
              raise SystemExit('Funds trigger CSS block not found')
          s=s.replace(old,new,1)

          marker='@keyframes fadeIn{from{opacity:0}to{opacity:1}}'
          breathe='@keyframes plusBreathe{0%,100%{transform:scale(1);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(48,209,88,.16)}50%{transform:scale(1.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 32px rgba(48,209,88,.32),0 0 0 5px rgba(48,209,88,.055)}}'
          if marker not in s:
              raise SystemExit('Keyframe marker not found')
          s=s.replace(marker,breathe+marker,1)

          reduced='@media(prefers-reduced-motion:reduce){.plus{animation:none}.funds,.plus,.plus:before,.plus:after{transition:none}}'
          s=s.replace('@media(max-width:720px){',reduced+'@media(max-width:720px){',1)

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Animate add funds trigger"
          git push
