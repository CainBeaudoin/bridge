name: Fix deposit scrolling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-deposit-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make deposit view fixed and non-scrollable
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          marker = '#chainView.active{display:flex;flex-direction:column;min-height:100%;overflow:hidden!important}'
          insert = '#addressView.active{display:flex;flex-direction:column;overflow:hidden!important;padding-right:0!important}#addressView .subhead{flex:0 0 auto}#addressView .deposit-layout{flex:1;min-height:0}'
          if insert not in s:
              if marker not in s:
                  raise SystemExit('Chain view marker not found')
              s = s.replace(marker, insert + marker, 1)
          mobile_old = '.deposit-layout{grid-template-columns:1fr}.qr-card{max-width:220px;width:100%;margin:0 auto}.pill{display:none}.subhead{margin-bottom:17px}'
          mobile_new = '.deposit-layout{grid-template-columns:1fr}.qr-card{max-width:220px;width:100%;margin:0 auto}#addressView .subhead{margin-bottom:10px}#addressView .deposit-layout{gap:10px}#addressView .qr-card{max-width:145px;padding:8px;border-radius:16px}#addressView .qr{padding:6px;border-radius:11px}#addressView .qr-caption{margin-top:5px;font-size:8px}#addressView .selected{margin-bottom:8px}#addressView .selected .chain-icon{width:36px;height:36px}#addressView .selected h2{font-size:17px}#addressView .address-card{padding:10px}#addressView .address{margin-top:6px;padding:8px;font-size:9px}#addressView .copy{height:36px;margin-top:6px}#addressView .status{margin-top:7px;padding:8px}#addressView .details{margin-top:7px}#addressView .row{min-height:32px}#addressView .warn{margin-top:7px;padding:7px 9px}.pill{display:none}.subhead{margin-bottom:17px}'
          if mobile_old in s:
              s = s.replace(mobile_old, mobile_new, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Make deposit view non-scrollable"
          git push
