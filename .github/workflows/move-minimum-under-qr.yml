name: Move minimum under QR
on:
  push:
    paths:
      - '.github/workflows/move-minimum-under-qr.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move minimum under QR and remove legacy demo UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()

          old_qr='<div class="qr-card"><div class="qr"><img id="qrImage" alt="Deposit address QR code"></div><div class="qr-caption">Scan with the wallet you are sending from.</div></div><div><div class="selected">'
          new_qr='<div class="qr-card"><div class="qr"><img id="qrImage" alt="Deposit address QR code"></div><div class="qr-caption">Scan with the wallet you are sending from.</div><div class="minimum"><strong>$5 minimum</strong><span>Required for bridge and swap routing.</span></div></div><div><div class="selected">'
          if old_qr not in s:
              raise SystemExit('QR card marker not found')
          s=s.replace(old_qr,new_qr,1)

          old_addr='<button class="copy" id="copyBtn">Copy address</button><div class="minimum"><strong>$5 minimum</strong><span>Required for bridge and swap routing.</span></div></div>'
          new_addr='<button class="copy" id="copyBtn">Copy address</button></div>'
          if old_addr not in s:
              raise SystemExit('address minimum marker not found')
          s=s.replace(old_addr,new_addr,1)

          old_css='.minimum{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;padding:9px 10px;border:1px solid rgba(255,255,255,.06);border-radius:11px;background:rgba(255,255,255,.025);color:var(--muted-2);font-size:9px;line-height:1.35}.minimum strong{color:#d7d7dc;font-size:10px;font-weight:700;white-space:nowrap}'
          new_css='.minimum{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-top:10px;padding:8px 9px;border:1px solid rgba(255,255,255,.06);border-radius:11px;background:rgba(255,255,255,.025);color:var(--muted-2);font-size:8.5px;line-height:1.35;text-align:center}.minimum strong{color:#d7d7dc;font-size:10px;font-weight:700;white-space:nowrap}'
          if old_css not in s:
              raise SystemExit('minimum CSS marker not found')
          s=s.replace(old_css,new_css,1)

          old_js="function enforceDepositActionUI(){const card=document.querySelector('#addressView .address-card');let min=document.querySelector('#addressView .minimum');if(card){if(!min){min=document.createElement('div');min.className='minimum';min.innerHTML='<strong>$5 minimum</strong><span>Required for bridge and swap routing.</span>'}if(min.parentElement!==card)card.append(min)}document.querySelectorAll('#addressView .demo,#addressView .warn').forEach(el=>el.remove())}"
          new_js="function enforceDepositActionUI(){const qrCard=document.querySelector('#addressView .qr-card');let min=document.querySelector('#addressView .minimum');if(qrCard){if(!min){min=document.createElement('div');min.className='minimum';min.innerHTML='<strong>$5 minimum</strong><span>Required for bridge and swap routing.</span>'}if(min.parentElement!==qrCard)qrCard.append(min)}document.querySelectorAll('#addressView .demo,#addressView .warn').forEach(el=>el.remove())}"
          if old_js not in s:
              raise SystemExit('runtime enforcement marker not found')
          s=s.replace(old_js,new_js,1)

          # Defensive cleanup: source should never ship yellow legacy demo elements.
          import re
          s=re.sub(r'<span class="demo">.*?</span>','',s)
          s=re.sub(r'<div class="warn">.*?</div>','',s)

          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text()
          assert '<span class="demo">' not in s
          assert '<div class="warn">' not in s
          assert '<div class="qr-caption">Scan with the wallet you are sending from.</div><div class="minimum">' in s
          assert "const qrCard=document.querySelector('#addressView .qr-card')" in s
          assert "if(min.parentElement!==qrCard)qrCard.append(min)" in s
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit source update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/move-minimum-under-qr.yml
          git add public/index.html
          git commit -m "Move deposit minimum under QR and remove demo UI"
          git push origin HEAD:main
