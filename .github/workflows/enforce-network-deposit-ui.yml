name: Enforce selected-network deposit UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-network-deposit-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce deposit action UI on every selected network
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()

          old="function nativeFor(n){return nativeSymbols[n.slug]||'Native'}function currentAddress(){return 'PLACEHOLDER_'+selected.slug.toUpperCase().replaceAll('-','_')+'_WALLET_ADDRESS_DO_NOT_SEND'}function refreshDeposit(){if(!selected)return;const native=nativeFor(selected),addr=currentAddress();$('depositTitle').textContent='Deposit on '+selected.name;$('depositSubtitle').textContent='Send USDC or '+native+' to this same address.';$('acceptedAssets').textContent='USDC + '+native;$('assetName').textContent='USDC + '+native;$('destinationText').textContent='USDC balance';$('addressValue').textContent=addr;$('qrImage').src='https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data='+encodeURIComponent(addr);reset()}"

          new="function nativeFor(n){return nativeSymbols[n.slug]||'Native'}function currentAddress(){return 'PLACEHOLDER_'+selected.slug.toUpperCase().replaceAll('-','_')+'_WALLET_ADDRESS_DO_NOT_SEND'}function enforceDepositActionUI(){const card=document.querySelector('#addressView .address-card');let min=document.querySelector('#addressView .minimum');if(card){if(!min){min=document.createElement('div');min.className='minimum';min.innerHTML='<strong>$5 minimum</strong><span>Required for bridge and swap routing.</span>'}if(min.parentElement!==card)card.append(min)}document.querySelectorAll('#addressView .demo,#addressView .warn').forEach(el=>el.remove())}function refreshDeposit(){if(!selected)return;const native=nativeFor(selected),addr=currentAddress();$('depositTitle').textContent='Deposit on '+selected.name;$('depositSubtitle').textContent='Send USDC or '+native+' to this same address.';$('acceptedAssets').textContent='USDC + '+native;$('assetName').textContent='USDC + '+native;$('destinationText').textContent='USDC balance';$('addressValue').textContent=addr;$('qrImage').src='https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data='+encodeURIComponent(addr);enforceDepositActionUI();reset()}"

          if old not in s:
              raise SystemExit('refreshDeposit block not found')
          s=s.replace(old,new,1)

          if "enforceDepositActionUI();reset()" not in s:
              raise SystemExit('network UI enforcement missing')
          if '<span class="demo">' in s or '<div class="warn">' in s:
              raise SystemExit('visible demo UI still present')
          if '<button class="copy" id="copyBtn">Copy address</button><div class="minimum">' not in s:
              raise SystemExit('minimum is not directly under copy button')

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enforce-network-deposit-ui.yml
          git add public/index.html
          git commit -m "Enforce deposit UI for every selected network"
          git push
