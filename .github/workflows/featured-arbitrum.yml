name: Featured Arbitrum swap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/featured-arbitrum.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Optimism with Arbitrum in featured networks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          old = "const featuredSlugs=['solana','ethereum','base','bnb','robinhood','tron','optimism','polygon'];"
          new = "const featuredSlugs=['solana','ethereum','base','bnb','robinhood','tron','arbitrum','polygon'];"
          if old not in s:
              raise SystemExit('Featured network block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Replace Optimism with Arbitrum in featured networks"
          git push
